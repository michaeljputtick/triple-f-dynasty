name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Publish
        run: dotnet publish TripleF.csproj -c Release -o out

      - name: Prepare for GitHub Pages
        run: |
          REPO="${{ github.event.repository.name }}"
          # Project sites live under /<repo>/; a <user>.github.io repo lives at the root.
          if [[ "$REPO" != *.github.io ]]; then
            sed -i "s|<base href=\"/\" />|<base href=\"/$REPO/\" />|" out/wwwroot/index.html
          fi
          # Pages has no SPA fallback; serving index.html as the 404 lets deep links like /hall load.
          cp out/wwwroot/index.html out/wwwroot/404.html
          # Without this, Pages' Jekyll step hides the _framework folder.
          touch out/wwwroot/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
